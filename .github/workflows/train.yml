# Nightly retrain: rebuilds public/model/profiles.json from all collected
# snapshots so the deployed app's predictions improve as data accumulates.
name: train
on:
  schedule:
    - cron: '20 3 * * *' # 03:20 UTC nightly
  workflow_dispatch:

concurrency:
  group: train # own group: sharing the collector's queue got this run
  cancel-in-progress: false # superseded (= cancelled) every night; ndjson
  # union-merge + rebase retries make parallel pushes safe anyway

jobs:
  train:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Refresh the event calendar from echo.lu
        run: node model/update-events.mjs
      - run: node model/train.mjs
      - name: Evaluate against the held-out last day
        run: node model/evaluate.mjs
      - name: Commit model
        run: |
          git config user.name "trainer-bot"
          git config user.email "actions@github.com"
          git add public/model/profiles.json public/model/eval.json public/events.json
          git diff --cached --quiet && exit 0
          git commit -m "retrain $(date -u +%F)"
          git pull --rebase origin ${GITHUB_REF_NAME}
          git push
